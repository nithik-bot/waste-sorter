<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Sorter</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f0f4f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 1rem; }
        #preview { width: 100%; border-radius: 10px; margin: 15px 0; display: none; border: 2px solid #ddd; }
        .upload-btn { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        #output { margin-top: 20px; font-weight: bold; font-size: 1.2rem; }
        #instructions { margin-top: 10px; color: #666; font-size: 0.95rem; line-height: 1.4; }
        .loading { color: #f39c12; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>♻️ Waste Classifier</h2>
    <p>Upload a photo to see how to dispose of it.</p>
    
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <button class="upload-btn" onclick="document.getElementById('imageInput').click()">Take or Select Photo</button>
    
    <img id="preview" alt="Scan preview">
    
    <div id="output"></div>
    <div id="instructions"></div>
</div>

<script>
    const input = document.getElementById('imageInput');
    const output = document.getElementById('output');
    const instructions = document.getElementById('instructions');
    const preview = document.getElementById('preview');

    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Reset UI
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        output.innerHTML = '<span class="loading">Analyzing item...</span>';
        instructions.innerText = '';

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64String = reader.result.split(',')[1];

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: base64String,
                    headers: { 'Content-Type': 'text/plain' }
                });
                
                const data = await response.json();
                
                // Handle OpenRouter/Qwen JSON response
                const result = typeof data === 'string' ? JSON.parse(data) : data;

                output.innerText = result.label;
                output.style.color = result.label.toLowerCase().includes('recycle') ? '#1976d2' : 
                                    result.label.toLowerCase().includes('compost') ? '#2e7d32' : '#d32f2f';
                instructions.innerText = result.instructions;

            } catch (err) {
                output.innerText = "Error scanning image";
                console.error(err);
            }
        };
        reader.readAsDataURL(file);
    };
</script>

</body>
</html>
